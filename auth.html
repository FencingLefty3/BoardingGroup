<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    
    <title>Boarding Group - Auth</title>

    <link rel="stylesheet" href="styleAuth.css">
    <link rel="icon" type="image/png" href="/faviconSQ.png">
</head>
<body>
    <form id="login" style="display: flex;">
        <h2>Login</h2>
        <p>Email:</p>
        <input type="email">

        <p>Password:</p>
        <input type="password">
        <div style="display: flex;flex-direction: row;width: 80%;justify-content: center;gap: 10%;margin: 5% 0;">
            <button>Sign Up</button>
            <button>Login</button>
        </div>
    </form>
    <form id="signup" style="display: none;">
        <h2>Sign Up</h2>
        <p>Username:</p>
        <input type="text">

        <p>Email:</p>
        <input type="email">

        <p>Password:</p>
        <input type="password">
        <div style="display: flex;flex-direction: row;width: 80%;justify-content: center;gap: 10%;margin: 5% 0;">
            <button>Login</button>
            <button>Sign Up</button>
        </div>
    </form>
</body>
